<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commission Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.26/jspdf.plugin.autotable.min.js"></script>
</head>

<body>
    <h1>Commission Calculator</h1>

    <!-- Section to Set Exercise Prices -->
    <div id="price-settings-container">
        <div id="price-settings-header">
            <h2>Set Exercise Prices and Deductions</h2>
            <button id="togglePriceSettings">▼</button>
        </div>
    
        <div id="price-settings">
            <div class="price-row">
                <label for="basicPrice">Basic Price:</label>
                <input type="number" id="basicPrice" placeholder="Enter Basic Price">
                <label for="basicDeduction">Basic Deduction:</label>
                <input type="number" id="basicDeduction" placeholder="Enter Basic Deduction">
            </div>
    
            <div class="price-row">
                <label for="targetPrice">Target Price:</label>
                <input type="number" id="targetPrice" placeholder="Enter Target Price">
                <label for="targetDeduction">Target Deduction:</label>
                <input type="number" id="targetDeduction" placeholder="Enter Target Deduction">
            </div>
    
            <div class="price-row">
                <label for="ptPrice">PT Price:</label>
                <input type="number" id="ptPrice" placeholder="Enter PT Price">
                <label for="ptDeduction">PT Deduction:</label>
                <input type="number" id="ptDeduction" placeholder="Enter PT Deduction">
            </div>
    
            <div class="button-group">
                <button id="savePrices">Save Prices</button>
                <button id="editPrices">Edit Prices</button>
            </div>
        </div>
    </div>
    
    
    
    
    <!-- Form to add people -->
    <form id="personForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required>
        <br>
        <label for="exerciseType">Exercise Type:</label>
        <select id="exerciseType" required>
            <option value="Basic">Basic</option>
            <option value="Target">Target</option>
            <option value="PT">PT</option>
        </select>
        <br>
        <label for="uniqueID">Unique ID:</label>
        <input type="text" id="uniqueID" required>
        <br>
        <button type="submit">Add</button>
    </form>

    <!-- Table to display records -->
    <table id="personTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Exercise Type</th>
                <th>Price</th>
                <th>Unique ID</th>
                <th>Commission</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <!-- Display the total commission -->
    <div id="totalCommissionBox">
        <h3>Total Commission: <span id="totalCommission">0</span></h3>
    </div>

    <!-- Submit invoice button -->
    <button id="submitInvoice">Submit Invoice</button>

    <script src="script.js"></script>
</body>
</html>
